name: Bootstrap Lockfile & Full Node 22 Validation Artifact

on:
  workflow_dispatch:

# SEGURANÇA (Missão 08.2 — Seção 9):
# Permissão estritamente read-only (contents: read). Nunca realiza commits automáticos
# nem utiliza tokens com permissão de escrita. Disponibiliza o package-lock.json
# gerado e validado em Node 22.14.0 como artefato baixável para commit manual.
permissions:
  contents: read

jobs:
  bootstrap-lockfile-node22:
    name: Generate package-lock.json & Validate (npm ci, typecheck, vitest, build) on Node 22.14.0
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Generate package-lock.json and execute full Node 22 validation pipeline
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/bootstrap-lockfile-and-validate.sh
          ./scripts/bootstrap-lockfile-and-validate.sh

      - name: Upload generated package-lock.json and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-node22-artifact
          path: |
            package-lock.json
            /tmp/bootstrap-lockfile-artifacts/*
          if-no-files-found: error
          retention-days: 30
