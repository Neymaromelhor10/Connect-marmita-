name: Staging Homologation Pipeline

on:
  workflow_dispatch:

jobs:
  homologation:
    runs-on: ubuntu-latest
    services:
      postgres-restore-drill:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: drill_password
          POSTGRES_DB: marmita_restore_drill
        ports:
          - 54332:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marmita_restore_drill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl

      - name: Initialize PostgreSQL Restore Drill & GoTrue Auth Container
        env:
          RESTORE_DB_URL: "postgresql://postgres:drill_password@127.0.0.1:54332/marmita_restore_drill"
          GOTRUE_IMAGE: "supabase/gotrue:v2.158.1"
          GOTRUE_JWT_SECRET: "super-secret-jwt-token-with-at-least-32-characters-long"
        run: |
          set -euo pipefail
          echo "[1/3] Validando instância isolada postgres-restore-drill (porta 54332)..."
          pg_isready -h 127.0.0.1 -p 54332 -U postgres -d marmita_restore_drill

          psql "$RESTORE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          COMMENT ON DATABASE marmita_restore_drill IS 'marmita_restore_drill';
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA public;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_auth_admin') THEN
              CREATE ROLE supabase_auth_admin WITH LOGIN SUPERUSER PASSWORD 'drill_password';
            ELSE
              ALTER ROLE supabase_auth_admin WITH LOGIN SUPERUSER PASSWORD 'drill_password';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN
              CREATE ROLE supabase_admin WITH LOGIN SUPERUSER PASSWORD 'drill_password';
            END IF;
          END $$;
          ALTER ROLE supabase_auth_admin SET search_path = auth, public;
          ALTER ROLE supabase_auth_admin IN DATABASE marmita_restore_drill SET search_path = auth, public;
          GRANT ALL ON SCHEMA auth TO postgres, supabase_auth_admin;
          GRANT USAGE ON SCHEMA public, auth TO anon, authenticated, service_role;
          SQL

          echo "[2/3] Baixando e iniciando container GoTrue ($GOTRUE_IMAGE) conectado ao banco de restore..."
          docker pull "$GOTRUE_IMAGE"
          docker rm -f marmita-gotrue-restore >/dev/null 2>&1 || true
          docker run -d --name marmita-gotrue-restore --network host \
            -e GOTRUE_API_HOST="0.0.0.0" \
            -e PORT="9999" \
            -e API_EXTERNAL_URL="http://127.0.0.1:9999" \
            -e GOTRUE_SITE_URL="http://localhost:3000" \
            -e GOTRUE_URI_ALLOW_LIST="*" \
            -e GOTRUE_DISABLE_SIGNUP="false" \
            -e GOTRUE_JWT_ADMIN_ROLES="service_role" \
            -e GOTRUE_JWT_AUD="authenticated" \
            -e GOTRUE_JWT_DEFAULT_GROUP_NAME="authenticated" \
            -e GOTRUE_JWT_EXP="3600" \
            -e GOTRUE_JWT_SECRET="$GOTRUE_JWT_SECRET" \
            -e GOTRUE_DB_DRIVER="postgres" \
            -e GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:drill_password@127.0.0.1:54332/marmita_restore_drill?search_path=auth" \
            -e GOTRUE_MAILER_AUTOCONFIRM="true" \
            -e GOTRUE_SMS_AUTOCONFIRM="true" \
            "$GOTRUE_IMAGE"

          echo "[3/3] Aguardando healthcheck HTTP do GoTrue em http://127.0.0.1:9999/health..."
          READY=0
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9999/health || true)" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "[ERRO] Container GoTrue não ficou saudável na porta 9999:" >&2
            docker logs marmita-gotrue-restore >&2 || true
            exit 1
          fi
          echo "[OK] GoTrue inicializado e respondendo HTTP 200 em http://127.0.0.1:9999/health."

      - name: Run full external staging homologation pipeline
        env:
          STAGING_CONFIRM_MARKER: "HOMOLOGACAO_AUTORIZADA"
          RESTORE_DRILL_CONFIRM_MARKER: "RESTORE_DRILL_AUTORIZADO"
          PRODUCTION_PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          RESTORE_TEST_DATABASE_URL: ${{ secrets.RESTORE_TEST_DATABASE_URL || 'postgresql://postgres:drill_password@127.0.0.1:54332/marmita_restore_drill' }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.STAGING_GEMINI_API_KEY }}
          WHATSAPP_APP_SECRET: ${{ secrets.STAGING_WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.STAGING_WHATSAPP_VERIFY_TOKEN }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
          GOTRUE_CONTAINER_ENABLED: ${{ secrets.RESTORE_TEST_GOTRUE_URL && '0' || '1' }}
          GOTRUE_DOCKER_IMAGE: "supabase/gotrue:v2.158.1"
          GOTRUE_JWT_SECRET: "super-secret-jwt-token-with-at-least-32-characters-long"
          RESTORE_TEST_GOTRUE_URL: ${{ secrets.RESTORE_TEST_GOTRUE_URL || 'http://127.0.0.1:9999' }}
          RESTORE_TEST_ANON_KEY: ${{ secrets.RESTORE_TEST_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlc3RvcmUtZHJpbGwtbG9jYWwiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcwMDAwMDAwMCwiZXhwIjoyMDUwMDAwMDAwfQ.5LtQu-NTTnuOxgoDtHKPheXSzYTlq_r7ptrQlQEarDg' }}
          RESTORE_SMOKE_EMAIL: ${{ secrets.RESTORE_SMOKE_EMAIL || 'op.a@homolog.local' }}
          RESTORE_SMOKE_PASSWORD: ${{ secrets.RESTORE_SMOKE_PASSWORD || 'SenhaHomolog123!' }}
        run: |
          chmod +x scripts/run-staging-homologation.sh scripts/backup-database.sh scripts/verify-restore-drill.sh
          ./scripts/run-staging-homologation.sh
