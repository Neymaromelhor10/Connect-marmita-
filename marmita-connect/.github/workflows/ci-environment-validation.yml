name: CI Environment, Lockfile & Official Validation

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-environment-and-lockfile:
    name: Node 22.14.0 Official Lockfile, Typecheck, Vitest & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.14.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Execute official validation pipeline (0. Migration Integrity -> A. Lockfile Verification -> B. npm ci -> C. Typecheck -> D. Vitest -> E. Build)
        id: run_validation
        shell: bash
        run: |
          set -uo pipefail

          ART_DIR="${RUNNER_TEMP:-/tmp}/ci-validation-artifacts"
          mkdir -p "$ART_DIR"

          COMMIT_SHA="$(git rev-parse HEAD 2>/dev/null || echo 'UNAVAILABLE')"
          BRANCH_REF="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'UNAVAILABLE')}"
          NODE_VER="$(node -v)"
          NPM_VER="$(npm -v)"
          OS_INFO="$(uname -a)"

          echo "=================================================================="
          echo "0. DIAGNÓSTICO DO RUNNER E VERIFICAÇÃO DE INTEGRIDADE DAS MIGRATIONS"
          echo "=================================================================="
          echo "Commit testado : $COMMIT_SHA ($BRANCH_REF)"
          echo "Node.js        : $NODE_VER"
          echo "npm            : $NPM_VER"
          echo "OS / Kernel    : $OS_INFO"

          # CORREÇÃO AF-11, Missão 07.2, Missão 07.4 & Missão 08.1:
          # Verifica estritamente os hashes SHA-256 das migrations históricas imutáveis (0000 a 0023)
          # e a sincronia de drizzle/migrations/meta/_journal.json.
          cat << 'EOF_SUMS' > "$ART_DIR/immutable-migrations-hashes.sha256"
          6f3718ada33ef1e1738e1b3a4e84ec14e43ccaf585256f5766b12ff6b24be9b1  drizzle/migrations/0000_create_marmitaria_saas_schema.sql
          a0faa2c7705da155d4cdadc188d73d5ce1d8a58a1de2d817f08a753d0abaa58e  drizzle/migrations/0001_audit_hardening_tenant_isolation_and_finance.sql
          061ac3e14be3c876cb168f89d3db855a8cd6f45d2c9b4fd6f9c290ab6c6f54dd  drizzle/migrations/0002_fix_assert_same_company_trigger.sql
          ef1d0d49684a206363c3f4932268147d9298546e638f2c9d46b1bfff03cf23cd  drizzle/migrations/0003_revoke_trigger_function_execute.sql
          dad57d97ac25941e5e539963369b4b1104d678068dd95cfa3cc833831ad12e14  drizzle/migrations/0004_marmita_sizes_and_message_parsing.sql
          5f0f070c3583b1acf64a1839a04bed19ef357845f037cd1119f9b92a070ed545  drizzle/migrations/0005_whatsapp_cloud_connections.sql
          af459c36b6e28a37a33b8329278f76fad2a3b1b09a5890a540c798c57ad335b7  drizzle/migrations/0006_orders_settled_by_payment.sql
          d058c439d2b576ed04ac5b15674b2252110091043d598a42522a48f4e1627fd4  drizzle/migrations/0007_whatsapp_connections_backend_only_writes.sql
          da7e5110f5ebc276b1f4b4407a92dc467da9e42a051195840bc88dbd83d2a9b3  drizzle/migrations/0008_order_date_brazil_default.sql
          c410a32e89ed7f872d30d4eba2835f32c93e90dcac7f4718404035e8b7285575  drizzle/migrations/0009_marmita_size_m_and_financial_guards.sql
          0577758e1f2aad7561c686dd04aecaff7a68a4e28ee2a583957a61c96ec64bd2  drizzle/migrations/0010_activate_financial_confirmation_ok_okk.sql
          4140215c4996166aa46435e32c2afe382b35d3c29e3e3b61d67eef9b82b6f1db  drizzle/migrations/0011_pre_production_hardening.sql
          aa1400f3913739d4e20df86feca73e30a17443ec25c7da8e002d17dcf571efd5  drizzle/migrations/0012_argon4_concurrency_scalability_and_rls_hardening.sql
          20f0dab35b8b7d8f0b754c4f7e1ff437d004a472df7bef68feb3c3bf32fd548c  drizzle/migrations/0013_argon4_queue_dashboard_and_rls_hardening.sql
          500bae25cc5560a9945912fb230fc3aa63e6fdaed5805f9de3bd887278cb5a00  drizzle/migrations/0014_argon4_round4_queue_advisory_and_review_hardening.sql
          962dcde0c88b6d19bd222279ae3ff9e42ff0de1d6f60c3c86dcf2650999c1044  drizzle/migrations/0015_argon4_round5_audit5_hardening.sql
          9139d92b29db00f55bd0d5679743677bad39d428511346063c9a314e701aa7c0  drizzle/migrations/0016_argon4_round6_critical_security_and_queue_fixes.sql
          8929e373469bf60a6fd93f385e685098e4c5ce6b9270c1e862d9210cf68306dc  drizzle/migrations/0017_argon4_round9_trigger_role_and_audit_hardening.sql
          fc9bf6b930bc318306586ab73869fcb45b89e5011b38a3aca9f28d7f8297c15e  drizzle/migrations/0018_argon4_forensic_audit_hardening.sql
          019e2e31cd33f8c3faac7705e75287b103771c07cf50d942d1634845f3223ef7  drizzle/migrations/0019_argon4_c09_queue_fencing_and_claim_hardening.sql
          82220c4b5db0eec4ab9d95e14225a04bcca9b5a52940e38f702c5a46b82cabf3  drizzle/migrations/0020_argon4_c09_lease_and_echo_hardening.sql
          637fe9ffd68fa77218ae946417c37ea2eae5826d6d2d325aaac7ce92ee741e86  drizzle/migrations/0021_argon4_missao07_af01_af10_hardening.sql
          2364bc41e9e13012b0bf487f957d276a55f3ef776b3bdc8558669b1f31add08c  drizzle/migrations/0022_argon4_missao07_2_surgical_remediation.sql
          2461125f4b2552bcedc8695760dba3dfcd73c0e9435d3bda9cc0f9ee4ffea551  drizzle/migrations/0023_argon4_missao07_4_security_and_regression_fixes.sql
          EOF_SUMS

          sed -i 's/^[[:space:]]*//' "$ART_DIR/immutable-migrations-hashes.sha256"

          node -e '
            const fs = require("fs");
            const journal = JSON.parse(fs.readFileSync("drizzle/migrations/meta/_journal.json", "utf8"));
            const sqlFiles = fs.readdirSync("drizzle/migrations").filter(f => f.endsWith(".sql")).sort();
            const tags = journal.entries.map(e => e.tag + ".sql");
            for (const f of sqlFiles) {
              if (!tags.includes(f)) {
                console.error("[ERRO] Migration não registrada em _journal.json:", f);
                process.exit(1);
              }
            }
            console.log("[OK] Todas as", sqlFiles.length, "migrations SQL estão sincronizadas em _journal.json.");
          ' > "$ART_DIR/journal-sync-check.log" 2>&1
          JOURNAL_EXIT=$?
          cat "$ART_DIR/journal-sync-check.log"

          if [ "$JOURNAL_EXIT" -eq 0 ] && sha256sum -c "$ART_DIR/immutable-migrations-hashes.sha256" > "$ART_DIR/baseline-sync-check.log" 2>&1; then
            SYNC_STATUS="MIGRATIONS_INTEGRITY_VERIFIED"
            echo "[OK] Todas as migrations históricas 0000-0023 estão íntegras."
          else
            SYNC_STATUS="MISMATCH_HISTORICAL_MIGRATIONS"
            echo "[BLOQUEIO DE INTEGRIDADE] Violação de integridade nas migrations históricas ou em _journal.json!" >&2
            cat "$ART_DIR/baseline-sync-check.log" >&2
          fi

          STEP_A_EXIT=999
          STEP_A_DUR=0
          STEP_B_EXIT=999
          STEP_B_DUR=0
          STEP_C_EXIT=999
          STEP_C_DUR=0
          STEP_D_EXIT=999
          STEP_D_DUR=0
          STEP_E_EXIT=999
          STEP_E_DUR=0
          LOCKFILE_SHA256="MISSING_IN_REPO"

          if [ "$SYNC_STATUS" != "MIGRATIONS_INTEGRITY_VERIFIED" ]; then
            echo "Interrompendo execução de testes devido à adulteração de migrations históricas." >&2
          else
            # CORREÇÃO MISSÃO 08.1 (Etapa F):
            # Exige estritamente package-lock.json versionado no repositório, sem geração
            # temporária de lockfile durante o workflow CI.
            echo "=================================================================="
            echo "A. VERIFICANDO LOCKFILE VERSIONADO (package-lock.json)"
            echo "=================================================================="
            T0=$(date +%s)
            if [ -f "package-lock.json" ]; then
              STEP_A_EXIT=0
              LOCKFILE_SHA256="$(sha256sum package-lock.json | awk '{print $1}')"
              cp package-lock.json "$ART_DIR/package-lock.json"
              echo "[OK] package-lock.json versionado encontrado no repositório (SHA-256: $LOCKFILE_SHA256)."
            else
              STEP_A_EXIT=1
              echo "[BLOQUEIO MISSÃO 08.1] package-lock.json não está versionado no repositório! Gere e versione o package-lock.json antes de executar o workflow." >&2
            fi
            T1=$(date +%s)
            STEP_A_DUR=$((T1 - T0))

            if [ "$STEP_A_EXIT" -eq 0 ]; then
              echo "=================================================================="
              echo "B. VALIDANDO INSTALAÇÃO REPRODUTÍVEL (npm ci)"
              echo "=================================================================="
              T0=$(date +%s)
              npm ci > "$ART_DIR/npm-ci.log" 2>&1
              STEP_B_EXIT=$?
              T1=$(date +%s)
              STEP_B_DUR=$((T1 - T0))
              cat "$ART_DIR/npm-ci.log"

              LOCKFILE_AFTER_CI="$(sha256sum package-lock.json | awk '{print $1}')"
              if [ "$LOCKFILE_AFTER_CI" != "$LOCKFILE_SHA256" ]; then
                echo "[ERRO] package-lock.json foi alterado durante npm ci ($LOCKFILE_SHA256 -> $LOCKFILE_AFTER_CI)!" >&2
                STEP_B_EXIT=1
              fi
            fi

            if [ "$STEP_B_EXIT" -eq 0 ]; then
              echo "=================================================================="
              echo "C. EXECUTANDO TYPECHECK OFICIAL (npm run typecheck)"
              echo "=================================================================="
              T0=$(date +%s)
              npm run typecheck > "$ART_DIR/typecheck.log" 2>&1
              STEP_C_EXIT=$?
              T1=$(date +%s)
              STEP_C_DUR=$((T1 - T0))
              cat "$ART_DIR/typecheck.log"

              echo "=================================================================="
              echo "D. EXECUTANDO VITEST OFICIAL COMPLETO (npx --no-install vitest run)"
              echo "=================================================================="
              T0=$(date +%s)
              npx --no-install vitest run > "$ART_DIR/vitest.log" 2>&1
              VITEST_EXIT=$?
              node tests/verify-missao07-af01-af11.mjs >> "$ART_DIR/vitest.log" 2>&1
              VERIFY_M07_EXIT=$?
              if [ "$VITEST_EXIT" -eq 0 ] && [ "$VERIFY_M07_EXIT" -eq 0 ]; then
                STEP_D_EXIT=0
              else
                STEP_D_EXIT=1
              fi
              T1=$(date +%s)
              STEP_D_DUR=$((T1 - T0))
              cat "$ART_DIR/vitest.log"

              echo "=================================================================="
              echo "E. EXECUTANDO BUILD OFICIAL (npm run build)"
              echo "=================================================================="
              T0=$(date +%s)
              npm run build > "$ART_DIR/build.log" 2>&1
              STEP_E_EXIT=$?
              T1=$(date +%s)
              STEP_E_DUR=$((T1 - T0))
              cat "$ART_DIR/build.log"
            fi
          fi

          cat << EOF_REP > "$ART_DIR/validation-summary.md"
          # Relatório de Execução CI — Validação Oficial

          - **Commit efetivamente testado:** \`$COMMIT_SHA\` (\`$BRANCH_REF\`)
          - **Integridade das Migrations (0000-0023):** \`$SYNC_STATUS\`
          - **Versão do Node.js:** \`$NODE_VER\`
          - **Versão do npm:** \`$NPM_VER\`
          - **Sistema Operacional:** \`$OS_INFO\`
          - **SHA-256 do \`package-lock.json\`:** \`$LOCKFILE_SHA256\`

          | Etapa | Comando Oficial | Exit Code | Duração (s) |
          | :--- | :--- | :---: | :---: |
          | **A. Verificação Lockfile** | \`test -f package-lock.json\` | \`$STEP_A_EXIT\` | \`${STEP_A_DUR}s\` |
          | **B. Instalação Reprodutível** | \`npm ci\` | \`$STEP_B_EXIT\` | \`${STEP_B_DUR}s\` |
          | **C. TypeScript** | \`npm run typecheck\` | \`$STEP_C_EXIT\` | \`${STEP_C_DUR}s\` |
          | **D. Vitest Oficial** | \`npx --no-install vitest run\` | \`$STEP_D_EXIT\` | \`${STEP_D_DUR}s\` |
          | **E. Build Oficial** | \`npm run build\` | \`$STEP_E_EXIT\` | \`${STEP_E_DUR}s\` |
          EOF_REP

          sed -i 's/^[[:space:]]*//' "$ART_DIR/validation-summary.md"
          cat "$ART_DIR/validation-summary.md" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SYNC_STATUS" != "MIGRATIONS_INTEGRITY_VERIFIED" ] || \
             [ "$STEP_A_EXIT" -ne 0 ] || [ "$STEP_B_EXIT" -ne 0 ] || \
             [ "$STEP_C_EXIT" -ne 0 ] || [ "$STEP_D_EXIT" -ne 0 ] || [ "$STEP_E_EXIT" -ne 0 ]; then
            exit 1
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-artifacts
          path: ${{ runner.temp }}/ci-validation-artifacts/*
          if-no-files-found: warn
          retention-days: 30
